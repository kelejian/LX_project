# ARS_optim/configs/param_space.yaml

# ---------------------------------------------------------
# 参数空间定义 (Parameter Space Definition)
# 严格按照 common.settings.FEATURE_ORDER 顺序定义 (0-12)
# role: control(执行机构) / state(不可控工况)
# trainable: True(参与梯度寻优) / False(固定参数，必须提供 default)
# ---------------------------------------------------------
parameters:
  # --- 1. 连续型状态参数 (State) ---
  - name: "impact_velocity"
    index: 0
    role: "state"
    type: "continuous"
    min: 23.5
    max: 65.0
    default: 56.0

  - name: "impact_angle"
    index: 1
    role: "state"
    type: "continuous"
    min: -45
    max: 45
    default: 0.0

  - name: "overlap"
    index: 2
    role: "state"
    type: "continuous"
    min: -1.0
    max: 1.0
    default: 1.0

  # --- 2. 连续型控制参数 (Control) ---
  - name: "LL1"
    index: 3
    role: "control"
    type: "continuous"
    min: 1.0  
    max: 7.0  
    trainable: False
    default: 2.5 # trainable=False 时必须有 default

  - name: "LL2"
    index: 4
    role: "control"
    type: "continuous"
    min: 0.5  
    max: 4.5  
    trainable: False
    default: 2.5

  - name: "BTF"
    index: 5
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True # trainable=True 时参与摊销优化与在线精调
    default: 20.0

  - name: "LLATTF"
    index: 6
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 150.0
    trainable: True
    default: 150.0

  - name: "AFT"
    index: 7
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True
    default: 20.0

  # --- 3. 座椅参数（control） ---
  - name: "SP"
    index: 8
    role: "control"
    type: "continuous"
    min: -110.0
    max: 110.0
    trainable: False
    default: 0.0

  - name: "SH"
    index: 9
    role: "control"
    type: "continuous"
    min: 0.0
    max: 60.0
    trainable: False
    default: 0.0

  - name: "RA"
    index: 10
    role: "control"
    type: "continuous"
    min: 15.0
    max: 40.0
    trainable: False
    default: 25.0

  # --- 4. 离散型状态参数 (State) ---
  - name: "is_driver_side"
    index: 11
    role: "state"
    type: "discrete"
    default: 1 # 1=主驾，0=副驾

  - name: "OT"
    index: 12
    role: "state"
    type: "discrete"
    default: 2 # 1=5th，2=50th，3=95th

# ---------------------------------------------------------
# 采样/约束规则集中配置（与 step0_params_sample_1220.py 保持一致）
# ---------------------------------------------------------
sampling_rules:
  coupling:
    aft_btf_delta_max: 25.0
    epsilon: 0.001

  overlap:
    special_abs_high: 0.99
    special_abs_low: 0.02
    force_to: 1.0
    domain:
      negative: [-1.0, -0.25]
      positive: [0.25, 1.0]

  overlap_angle:
    overlap_abs_min: 0.25
    overlap_abs_max: 0.3
    angle_abs_min: 30.0
    angle_sampling:
      positive_overlap:
        - [0.25, 0.26, -45.0, -40.0]
        - [0.26, 0.28, -45.0, -35.0]
        - [0.28, 0.30, -45.0, -30.0]
      negative_overlap:
        - [-0.26, -0.25, 40.0, 45.0]
        - [-0.28, -0.26, 35.0, 45.0]
        - [-0.30, -0.28, 30.0, 45.0]

  seat_constraints:
    "1_1": [[40, 0], [110, 5.5], [110, 60], [80, 60], [80, 30], [40, 30]]
    "1_2": [[-40, -2.222222], [60, 3.333333], [60, 60], [-40, 60]]
    "1_3": [[-60, -3.333333], [30, 1.666667], [30, 60], [-60, 60]]
    "0_1": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_2": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_3": [[-110, 0], [49, 0], [49, 0], [-110, 0]]

  ra_values:
    "1_1": [15, 20, 25]
    "1_2": [15, 20, 25, 30]
    "1_3": [15, 20, 25, 30]
    "0_1": [20, 25, 30, 35, 40]
    "0_2": [20, 25, 30, 35, 40]
    "0_3": [20, 25, 30, 35, 40]