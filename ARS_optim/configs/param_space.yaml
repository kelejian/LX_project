# ARS_optim/configs/param_space.yaml

# ---------------------------------------------------------
# 参数空间定义 (Parameter Space Definition)
# 严格按照 common.settings.FEATURE_ORDER 顺序定义 (0-12)
# role: control(执行机构) / state(不可控工况)
# trainable: True(参与梯度寻优) / False(固定参数，必须提供 default)
# ---------------------------------------------------------
parameters:
  # --- 1. 连续型状态参数 (State) ---
  - name: "impact_velocity"
    index: 0
    role: "state"
    type: "continuous"
    default: 56.0

  - name: "impact_angle"
    index: 1
    role: "state"
    type: "continuous"
    default: 0.0

  - name: "overlap"
    index: 2
    role: "state"
    type: "continuous"
    default: 1.0

  # --- 2. 连续型控制参数 (Control) ---
  - name: "LL1"
    index: 3
    role: "control"
    type: "continuous"
    min: 1.0  
    max: 7.0  
    trainable: False
    default: 2.5 # [硬约束] trainable=False 时必须有 default

  - name: "LL2"
    index: 4
    role: "control"
    type: "continuous"
    min: 0.5  
    max: 4.5  
    trainable: False
    default: 2.5 # [硬约束] trainable=False 时必须有 default

  - name: "BTF"
    index: 5
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True # 参与摊销优化与在线精调
    default: 20.0

  - name: "LLATTF"
    index: 6
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 150.0
    trainable: True
    default: 150.0

  - name: "AFT"
    index: 7
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True
    default: 20.0

  # --- 3. 乘员与座椅状态 (State) ---
  - name: "SP"
    index: 8
    role: "state"
    type: "continuous"
    default: 0.0

  - name: "SH"
    index: 9
    role: "state"
    type: "continuous"
    default: 0.0

  - name: "RA"
    index: 10
    role: "state"
    type: "continuous"
    default: 25.0

  # --- 4. 离散型状态参数 (State) ---
  - name: "is_driver_side"
    index: 11
    role: "state"
    type: "discrete"
    default: 1 # 1=主驾，0=副驾

  - name: "OT"
    index: 12
    role: "state"
    type: "discrete"
    default: 2 # 1=5th，2=50th，3=95th