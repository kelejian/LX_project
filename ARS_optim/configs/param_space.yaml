# ============================================================
# ARS_optim 参数空间与约束配置
# ============================================================
#
# 这份文件是 ARS_optim 运行时唯一使用的参数语义来源，外部设计说明文档只用于人工查阅，不会被代码直接读取。
#
# 使用规则：
# 1. `parameters` 必须严格按 common.settings.FEATURE_ORDER 排列。
# 2. `base_min/base_max` 用于输入端合法性校验。
# 3. `opt_min/opt_max` 只对 trainable control 生效，用于寻优边界。
# 4. `constraint_rules.coupling` 用于输入端与输出端共用的硬约束。
# 5. `constraint_rules.extra_output_constraints` 只在寻优解阶段生效。
# 6. 当前 trainable=false 的 control 仍然属于 control，只是当前在训练和评估时作为 context 输入。


# ============================================================
# 参数定义
# ============================================================
parameters:
  # ----------------------------------------------------------
  # state 参数：工况本身，不参与寻优
  # ----------------------------------------------------------
  - name: "impact_velocity"
    index: 0
    role: "state"
    type: "continuous"
    base_min: 23.5
    base_max: 65.0
    default: 56.0

  - name: "impact_angle"
    index: 1
    role: "state"
    type: "continuous"
    base_min: -45
    base_max: 45
    default: 0.0

  - name: "overlap"
    index: 2
    role: "state"
    type: "continuous"
    base_min: -0.99
    base_max: 1.0
    default: 1.0

  # ----------------------------------------------------------
  # control 参数：无论当前是否 trainable，都归属于控制参数
  # ----------------------------------------------------------
  - name: "LL1"
    index: 3
    role: "control"
    type: "continuous"
    base_min: 1.0
    base_max: 7.0
    opt_min: 1.0
    opt_max: 4.5
    trainable: false
    default: 2.7

  - name: "LL2"
    index: 4
    role: "control"
    type: "continuous"
    base_min: 0.5
    base_max: 4.5
    opt_min: 0.5
    opt_max: 2.7
    trainable: false
    default: 1.4

  - name: "BTF"
    index: 5
    role: "control"
    type: "continuous"
    base_min: 10.0
    base_max: 100.0
    opt_min: 10.0
    opt_max: 100.0
    trainable: true
    default: 20.0

  - name: "LLATTF"
    index: 6
    role: "control"
    type: "continuous"
    base_min: 10.0
    base_max: 150.0
    opt_min: 10.0
    opt_max: 150.0
    trainable: true
    default: 150.0

  - name: "AFT"
    index: 7
    role: "control"
    type: "continuous"
    base_min: 10.0
    base_max: 100.0
    opt_min: 10.0
    opt_max: 100.0
    trainable: true
    default: 20.0

  - name: "SP"
    index: 8
    role: "control"
    type: "continuous"
    base_min: -110.0
    base_max: 110.0
    opt_min: -110.0
    opt_max: 110.0
    trainable: false
    default: 0.0

  - name: "SH"
    index: 9
    role: "control"
    type: "continuous"
    base_min: -3.33
    base_max: 60.0
    opt_min: -3.3
    opt_max: 60.0
    trainable: false
    default: 0.0

  - name: "RA"
    index: 10
    role: "control"
    type: "continuous"
    base_min: 15.0
    base_max: 40.0
    opt_min: 15.0
    opt_max: 40.0
    trainable: false
    default: 25.0

  # ----------------------------------------------------------
  # 离散 state 参数
  # ----------------------------------------------------------
  - name: "is_driver_side"
    index: 11
    role: "state"
    type: "discrete"
    values: [0, 1]
    default: 0

  - name: "OT"
    index: 12
    role: "state"
    type: "discrete"
    values: [1, 2, 3]
    default: 2


# ============================================================
# 约束规则
# ============================================================
constraint_rules:
  # ----------------------------------------------------------
  # 输入端与输出端共享的耦合约束
  # ----------------------------------------------------------
  coupling:
    # AFT 上界约束：AFT <= BTF + aft_btf_delta_max - epsilon
    aft_btf_delta_max: 25.0

    # LLATTF 下界约束：LLATTF >= BTF + llattf_btf_delta_min
    llattf_btf_delta_min: 0.0

    # LL2 / LL1 耦合约束：LL2 <= LL1 + ll2_ll1_delta_max
    ll2_ll1_delta_max: 0.0

    # 边界比较容忍度，用于避免浮点数比较造成边界抖动。
    epsilon: 0.0001

  # ----------------------------------------------------------
  # 仅在输出端寻优阶段生效的额外约束
  # ----------------------------------------------------------
  extra_output_constraints:
    # AFT 下界约束：AFT >= BTF + aft_btf_delta_min
    aft_btf_delta_min: 0.0

  # ----------------------------------------------------------
  # overlap 基本合法域
  # ----------------------------------------------------------
  overlap:
    domain:
      negative: [-0.99, -0.25]
      positive: [0.25, 1.0]

  # ----------------------------------------------------------
  # overlap-angle 特殊工况带
  # ----------------------------------------------------------
  # 训练采样时，如果样本满足 0.25 <= |overlap| < 0.3，则 overlap 与 impact_angle 不参与连续扰动。
  # `angle_sampling` 同时给出该带内不同 overlap 段对应的允许角度区间，供输入端合法性检查共用。
  overlap_angle:
    overlap_abs_min: 0.25
    overlap_abs_max: 0.3
    angle_abs_min: 30.0
    angle_sampling:
      positive_overlap:
        - [0.25, 0.26, -45.0, -40.0]
        - [0.26, 0.28, -45.0, -35.0]
        - [0.28, 0.30, -45.0, -30.0]
      negative_overlap:
        - [-0.26, -0.25, 40.0, 45.0]
        - [-0.28, -0.26, 35.0, 45.0]
        - [-0.30, -0.28, 30.0, 45.0]

  # ----------------------------------------------------------
  # 座椅平移可行域
  # ----------------------------------------------------------
  # key = "is_driver_side_OT"，value = 若干 [SP, SH] 顶点，按多边形处理。
  # 若某个多边形在 SH 方向退化成零宽，则输入端扰动与输出端投影都会把 SH 视为冻结维；若在 SP 方向退化成零宽，则 SP 视为冻结维。
  seat_constraints:
    "1_1": [[40, 0], [110, 5.5], [110, 60], [80, 60], [80, 30], [40, 30]]
    "1_2": [[-40, -2.222222], [60, 3.333333], [60, 60], [-40, 60]]
    "1_3": [[-60, -3.333333], [30, 1.666666], [30, 60], [-60, 60]]
    "0_1": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_2": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_3": [[-110, 0], [49, 0], [49, 0], [-110, 0]]

  # ----------------------------------------------------------
  # RA 允许取值
  # ----------------------------------------------------------
  # key = "is_driver_side_OT"，value = [ra_min, ra_max]。
  # 这里直接按连续区间表达运行时语义，避免把条件区间误读成离散枚举值集合。
  ra_ranges:
    "1_1": [15, 25]
    "1_2": [15, 30]
    "1_3": [15, 30]
    "0_1": [20, 40]
    "0_2": [20, 40]
    "0_3": [20, 40]
