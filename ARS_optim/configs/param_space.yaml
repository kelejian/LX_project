# ARS_optim/configs/param_space.yaml

# ---------------------------------------------------------
# 参数空间定义 (Parameter Space Definition)
# 严格按照 common.settings.FEATURE_ORDER 顺序定义 (0-12)
# role: control(执行机构) / state(不可控工况)
# trainable: True(参与梯度寻优) / False(当前阶段固定)
# min/max: 对于状态参数是取值范围（和params_constraint.md中一致，是数据集覆盖的范围）；对于控制参数是优化边界（规定了可调范围，是数据集覆盖范围的子集！）
# 语义约定：
# - context = state + trainable=False 的 control
# - 这类固定 control 仍然保留 role=control，不会被降格为 state；未来只需修改 trainable 即可重新纳入优化变量
# - 任何未由调用方显式覆盖的特征位置，都统一回退到这里的 default
# ---------------------------------------------------------
parameters:
  # --- 连续型状态参数 (State) ---
  - name: "impact_velocity"
    index: 0
    role: "state"
    type: "continuous"
    min: 23.5
    max: 65.0
    default: 56.0

  - name: "impact_angle"
    index: 1
    role: "state"
    type: "continuous"
    min: -45
    max: 45
    default: 0.0

  - name: "overlap"
    index: 2
    role: "state"
    type: "continuous"
    min: -0.99
    max: 1.0
    default: 1.0

  # --- 连续型控制参数 (Control) ---
  - name: "LL1"
    index: 3
    role: "control"
    type: "continuous"
    min: 1.0  
    max: 4.5  
    trainable: False
    default: 2.5

  - name: "LL2"
    index: 4
    role: "control"
    type: "continuous"
    min: 0.5  
    max: 2.7  
    trainable: False
    default: 2.5

  - name: "BTF"
    index: 5
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True # trainable=True 时参与摊销优化与局部精调
    default: 20.0

  - name: "LLATTF"
    index: 6
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 150.0
    trainable: True
    default: 150.0

  - name: "AFT"
    index: 7
    role: "control"
    type: "continuous"
    min: 10.0 
    max: 100.0
    trainable: True
    default: 20.0

  - name: "SP"
    index: 8
    role: "control"
    type: "continuous"
    min: -110.0
    max: 110.0
    trainable: True
    default: 0.0

  - name: "SH"
    index: 9
    role: "control"
    type: "continuous"
    min: -3.3
    max: 60.0
    trainable: True
    default: 0.0

  - name: "RA"
    index: 10
    role: "control"
    type: "continuous"
    min: 15.0
    max: 40.0
    trainable: True
    default: 25.0

  # --- 离散型状态参数 (State) ---
  - name: "is_driver_side"
    index: 11
    role: "state"
    type: "discrete"
    values: [0, 1]
    default: 1 # 1=主驾，0=副驾

  - name: "OT"
    index: 12
    role: "state"
    type: "discrete"
    values: [1, 2, 3]
    default: 2 # 1=5th，2=50th，3=95th

# ---------------------------------------------------------
# 采样/约束规则集中配置
# ---------------------------------------------------------
sampling_rules:
  coupling:
    aft_btf_delta_max: 25.0
    llattf_btf_delta_min: 0.0
    ll2_ll1_delta_max: 0.0
    epsilon: 0.001

  overlap:
    domain:
      negative: [-1.0, -0.25]
      positive: [0.25, 1.0]

  overlap_angle:
    overlap_abs_min: 0.25
    overlap_abs_max: 0.3
    angle_abs_min: 30.0
    angle_sampling:
      positive_overlap:
        - [0.25, 0.26, -45.0, -40.0]
        - [0.26, 0.28, -45.0, -35.0]
        - [0.28, 0.30, -45.0, -30.0]
      negative_overlap:
        - [-0.26, -0.25, 40.0, 45.0]
        - [-0.28, -0.26, 35.0, 45.0]
        - [-0.30, -0.28, 30.0, 45.0]

  seat_constraints:
    "1_1": [[40, 0], [110, 5.5], [110, 60], [80, 60], [80, 30], [40, 30]]
    "1_2": [[-40, -2.222222], [60, 3.333333], [60, 60], [-40, 60]]
    "1_3": [[-60, -3.333333], [30, 1.666666], [30, 60], [-60, 60]]
    "0_1": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_2": [[-110, 0], [110, 0], [110, 0], [-110, 0]]
    "0_3": [[-110, 0], [49, 0], [49, 0], [-110, 0]]

  ra_values:
    "1_1": [15, 20, 25]
    "1_2": [15, 20, 25, 30]
    "1_3": [15, 20, 25, 30]
    "0_1": [20, 25, 30, 35, 40]
    "0_2": [20, 25, 30, 35, 40]
    "0_3": [20, 25, 30, 35, 40]