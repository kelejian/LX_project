# ARS_optim/configs/default_config.yaml

# ===========================
# 1. 项目基础设置
# ===========================
project_name: "LX-ARS-optim"
version: "1.0.0"
seed: 42
device: "cuda" # 或 "cpu"

# ===========================
# 2. 外部依赖配置 (与环境解耦)
# ===========================
# 仅指定代理模型权重的相对位置，根路径由代码从 common.settings.PULSE_PREDICT_DIR
# 和 common.settings.INJURY_PREDICT_DIR 分别解析。
surrogate:
  # pulse 模型相对路径
  pulse_checkpoint: "saved/models/HybridPulseCNN/0303_213959/model_best.pth"
  # injury 模型相对路径
  checkpoint_rel_path: "runs/InjuryPredictModel_03032051/best_val_loss.pth"

# ===========================
# 3. 策略网络(Strategy Net)训练 - 摊销优化超参
# ===========================
strategy_net:
  hidden_dims: [128, 256, 128] # MLP 隐藏层架构
  activation: "LeakyReLU"
  dropout: 0.1
  pulse_channels: 2      # 波形输入通道（当前为 XY 两通道）
  pulse_embed_dim: 32    # 波形编码后的嵌入维度
  
  train:
    batch_size: 256
    max_iterations: 50000  # 放弃 Epoch 概念，使用最大迭代步数控制无标签自监督数据流
    lr: 0.001
    weight_decay: 1e-4
    log_interval: 10
    save_best: true
    save_last: true
    scheduler:
      type: "cosine"      # none | cosine | step
      T_max: 50000
      eta_min: 1.0e-5
    val_interval: 500       # 每隔多少 iterations 评估一次完整验证集
    val_batch_size: 1024    # 验证阶段批大小（不影响训练batch）
    gradient_clip_max_norm: 1.0 # 梯度裁剪阈值
    jitter_ratio: 0.01      # 经验池连续参数扰动幅度（占参数范围比例）
    jitter_prob: 1.0        # 每个连续参数施加扰动的概率
    ema:
      enabled: true          # 是否启用 EMA 作为 train_best 的判据
      alpha: 0.98            # EMA 平滑系数，越大越平滑
      warmup_iters: 100      # EMA 选优预热步数，预热前不更新 train_best
      log_to_tensorboard: true

# ===========================
# 4. 在线寻优(Online Optimization) - 策略网络直推和局部精调超参
# ===========================
optimization:
  # 是否直推
  direct_inference: False # True: 需要进行策略网络直推；False: 使用默认参数作为初始解进行局部精调，不进行策略网络直推
  # 直推后的精调迭代参数
  refine_steps: 50         # 局部精调迭代次数 k. 若为0，则仅依赖策略网络直接推理
  lr: 0.05                 # 代理模型梯度下降步长 (针对归一化后的参数)
  optimize_in_normalized: False  # 是否在归一化空间进行局部精调
  
  # 综合目标函数(Loss)各部位风险权重
  objectives:
    weight_hic: 1.0
    weight_dmax: 1.0
    weight_nij: 1.0
    weight_penalty: 10.0   # 物理约束惩罚项系数

  # 训练分布偏离惩罚项（用于抑制策略输出落入经验池稀疏区域）
  distribution_penalty:
    enabled: true
    method: "mahalanobis"     # mahalanobis | knn
    weight: 0.01               # 默认小权重，避免策略过于保守
    feature_space: "context"  # context | context_control
    k: 8                       # knn 模式的近邻数量
    eps: 1.0e-6                # 数值稳定项
    clip_max: 10.0             # 单样本惩罚上限，避免极端值主导训练
    max_ref_samples: 20000     # 构建参考分布时使用的最大样本数，0表示不截断
    normalize_by_train_stats: true

# ===========================
# 5. 评估(Evaluation)
# ===========================
evaluation:
  eval_batch_size: 512   # 评估时分批推理的批大小，用于降低显存峰值
  default_strategy_ckpt: null  # 可选：默认策略权重路径（绝对路径或相对 ARS_optim 目录）
  strict_default_ckpt: true  # true时仅允许自动加载 val_best_model.pth；找不到则直接报错