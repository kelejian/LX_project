# ARS_optim/configs/default_config.yaml
#
# 这个配置文件只描述 ARS_optim 自己需要关心的训练/评估超参数与外部模型权重位置。
# 其中：
# 1. 输入归一化仍然统一以项目根目录下的 normalization_config.json 为准；
# 2. 参数可调范围与硬约束来自 param_space.yaml；
# 3. 训练/评估脚本均默认在 LX_project 根目录下以 `python -m xxx` 方式运行。

seed: 123
device: "cuda"

surrogate:
  # PulsePredict 最优权重，相对 PulsePredict 根目录解析。
  pulse_checkpoint: "saved/models/HybridPulseCNN/0303_213959/model_best.pth"
  # InjuryPredict 最优权重，相对 InjuryPredict 根目录解析。
  checkpoint_rel_path: "runs/InjuryPredictModel_03032051/best_val_loss.pth"

strategy_net:
  # 波形编码器输入通道数。当前代理链路输出为二维碰撞加速度波形。
  pulse_channels: 2
  # TCN 主干的逐层通道配置。
  tcn_channels_list: [64, 128, 256]
  tcn_output_dim: 128
  tcn_kernel_init: 8
  tcn_kernel_mid: 3

  # context 编码器与融合后解码器的 MLP 规模。
  mlp_encoder_hidden: 192
  mlp_encoder_layers: 3
  mlp_encoder_output_dim: 128
  mlp_decoder_hidden: 160
  mlp_decoder_layers: 3
  mlp_decoder_output_dim: 96
  dropout_mlp: 0.1
  dropout_tcn: 0.0

  train:
    # 自监督训练采用无限数据流，因此不使用 epoch，而用最大迭代步数停止。
    batch_size: 1024
    max_iterations: 20000
    lr: 2.0e-4
    weight_decay: 1.0e-4
    log_interval: 10
    save_best: true
    save_last: true

    scheduler:
      # 只调训练阶段的策略网络权重学习率。
      # 可选: none | cosine | step
      type: "cosine"
      # 当 type=cosine 时，T_max 可写整数，也可写 "max_iters"。
      T_max: "max_iters" # "max_iters" 表示与本段 max_iterations 保持一致，避免手动重复维护两份迭代上限。
      eta_min: 1.0e-5
      # 当 type=step 时，按 schedule_step_size 步长衰减 lr，gamma 是衰减率。
      step_size: 400
      gamma: 0.5

    val_interval: 500 # 每隔多少个 iteration 在 injury_val 固定切片上做一次完整验证。
    val_batch_size: 1024 # 验证阶段批大小，不影响实际评估语义。
    gradient_clip_max_norm: 2.0 # 梯度裁剪最大范数，抑制训练初期不稳定的梯度爆炸。

    # 训练流来自 injury_train 经验池 + 合法扰动。
    # 扰动后的样本若破坏 base 范围或耦合约束，会整行回退原样本。
    jitter_ratio: 0.01
    jitter_prob: 1.0

    # TensorBoard 文件会单独写到本次训练目录下的 tensorboard/ 子目录。
    tensorboard: true

    ema:
      # train_best 权重按 EMA 平滑后的 train_loss 选取；
      # val_best 则始终按固定验证集上的 val_loss 选取。
      enabled: true
      alpha: 0.98
      warmup_iters: 500
      log_to_tensorboard: true

optimization:
  # true: 先做策略直推生成 Opt1，再从 Opt1 或 default 出发做局部精调；
  # false: 不加载策略权重，局部精调直接从 default 起步。
  direct_inference: true

  # 局部精调步数。=0 时不生成 Opt2。
  refine_steps: 2000
  # Adam 在无量纲潜空间 z 上的初始学习率。
  lr: 0.005

  scheduler:
    # 局部精调全程都使用这里定义的学习率调度器，避免后期震荡。
    # 可选: none | cosine | step
    type: "cosine"
    # 当 type=cosine 时，T_max 可写整数，也可写 "max_iters"。
    # 这里的 "max_iters" 专指局部精调总步数 refine_steps。
    T_max: "max_iters"
    eta_min: 0.0
    # 当 type=step 时，按 schedule_step_size 步长衰减 lr，gamma 是衰减率。
    step_size: 400
    gamma: 0.5

  objectives:
    weight_hic: 2.0
    weight_dmax: 1.0
    weight_nij: 1.0
    # 物理约束软惩罚权重，作用于投影前的原始游离解。
    weight_penalty: 10.0

  distribution_penalty:
    # 合法域内的分布偏离惩罚，抑制解落入训练经验池未覆盖的空洞区域。
    enabled: false
    method: "mahalanobis"      # mahalanobis | knn
    weight: 0.01
    feature_space: "context_control"  # context | context_control
    k: 8
    eps: 1.0e-6
    clip_max: 10.0
    # <=0 表示使用完整 injury_train 参考池；>0 时按 seed 做一次性随机子采样。
    max_ref_samples: 20000
    normalize_by_train_stats: true

evaluation:
  # 评估阶段批大小，只影响分批推理开销，不改变逐 case 优化语义。
  eval_batch_size: 1024
  # 建议在每次切换评估权重时显式填写当前策略权重，或在运行 run_eval 时用 --strategy_ckpt 指定。
  strategy_checkpoint: null # 仅在 direct_inference=true 时使用。
