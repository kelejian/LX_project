# ARS_optim/configs/default_config.yaml

# ===========================
# 1. 项目基础设置
# ===========================
project_name: "LX-ARS-optim"
version: "1.0.0"
seed: 42
device: "cuda" # 或 "cpu"

# ===========================
# 2. 外部依赖配置 (与环境解耦)
# ===========================
# 仅指定代理模型权重的相对位置，根路径将由代码从 common.settings.INJURY_PREDICT_DIR 获取
surrogate:
  checkpoint_rel_path: "runs/InjuryPredictModel_01281059/best_val_loss.pth"

# ===========================
# 3. 策略网络(Strategy Net)训练 - 摊销优化超参
# ===========================
strategy_net:
  hidden_dims: [128, 256, 128] # MLP 隐藏层架构
  activation: "LeakyReLU"
  dropout: 0.1
  
  train:
    batch_size: 256
    max_iterations: 50000  # 放弃 Epoch 概念，使用最大迭代步数控制无标签自监督数据流
    lr: 0.001
    weight_decay: 1e-4

# ===========================
# 4. 在线寻优(Online Optimization) - 策略网络直推和局部精调超参
# ===========================
optimization:
  # 是否直推
  direct_inference: False # True: 需要进行策略网络直推；False: 使用默认参数作为初始解进行局部精调，不进行策略网络直推
  # 直推后的精调迭代参数
  refine_steps: 50         # 局部精调迭代次数 k. 若为0，则仅依赖策略网络直接推理
  lr: 0.05                 # 代理模型梯度下降步长 (针对归一化后的参数)
  
  # 综合目标函数(Loss)各部位风险权重
  objectives:
    weight_hic: 1.0
    weight_dmax: 1.0
    weight_nij: 1.0